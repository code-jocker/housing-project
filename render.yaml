databases:
  - name: housingconnect-db
    databaseName: housingconnect
    user: housingconnect
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"

services:
  - type: web
    name: housingconnect-api
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: backend
    buildCommand: npm install --no-audit --no-fund && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: housingconnect-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_ORIGIN
        value: "*"
      - key: OTP_DEBUG
        value: "false"
      - key: AFRICASTALKING_USERNAME
        sync: false
      - key: AFRICASTALKING_API_KEY
        sync: false
      - key: AFRICASTALKING_SENDER_ID
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_UPLOAD_PRESET
        sync: false
      - key: PRIVATE_STORAGE_ENDPOINT
        sync: false
      - key: PRIVATE_STORAGE_REGION
        value: auto
      - key: PRIVATE_STORAGE_BUCKET
        sync: false
      - key: PRIVATE_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: PRIVATE_STORAGE_SECRET_ACCESS_KEY
        sync: false
